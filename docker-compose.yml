services:
  postgres:
    image: postgres:18-alpine
    container_name: wedding_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-wedding}
      POSTGRES_USER: ${DB_USERNAME:-wedding}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-wedding} -d ${DB_DATABASE:-wedding}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - app_network

  php:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: wedding_php
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./backend:/var/www/html:cached
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - app_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: wedding_frontend
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ./frontend:/app:cached
      - /app/node_modules
    depends_on:
      - php
    networks:
      - app_network

  nginx:
    image: nginx:stable-alpine
    container_name: wedding_nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./backend:/var/www/html:ro
    depends_on:
      - php
      - frontend
    networks:
      - app_network

volumes:
  pgdata:
    driver: local

networks:
  app_network:
    driver: bridge
